name: Pruebas Python

on:
  push:
    branches: [main, "m2/**"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r backend/requirements.txt
      - name: Compilar módulos
        run: python -m compileall -q backend motor scripts
      - name: Ejecutar pruebas
        run: python -m unittest discover -s scripts/pruebas -p "test_*.py" -v
